<title>Krewtree emails preview</title>
<style>
  :root {
    --header-bg: #0A232D;
    --button-bg: #6D7531;
    --footer-bg: #F6F2E8;
    --canvas-bg: #FFFFFF;
    --card-bg: #FFFFFF;
    --body-text: #1C3D4A;
    --muted-text: #6B7280;
    --border: #E5E7EB;
    --secondary-card-bg: #F9FAFB;
    --toc-bg: #FAFAFB;
    --meta-bg: #F5F5F7;
    --tag-tx: #ECFDF5;
    --tag-tx-text: #065F46;
    --tag-com: #FEF3C7;
    --tag-com-text: #92400E;
    --tag-sec: #FEE2E2;
    --tag-sec-text: #991B1B;
  }
  * { box-sizing: border-box; }
  html, body {
    margin: 0;
    padding: 0;
    height: 100vh;
    overflow: hidden;
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
    color: var(--body-text);
    background: transparent;
  }
  .app {
    display: flex;
    height: 100vh;
  }

  /* -------- Sticky TOC sidebar -------- */
  .toc {
    width: 280px;
    flex-shrink: 0;
    overflow-y: auto;
    border-right: 1px solid var(--border);
    background: var(--toc-bg);
    padding: 24px 20px 60px;
    font-size: 13px;
    line-height: 1.5;
  }
  .toc-title {
    font-size: 16px;
    font-weight: 700;
    color: var(--body-text);
    margin: 0 0 4px 0;
  }
  .toc-subtitle {
    font-size: 12px;
    color: var(--muted-text);
    margin: 0 0 24px 0;
  }
  .toc-persona {
    font-size: 11px;
    font-weight: 700;
    letter-spacing: 0.08em;
    text-transform: uppercase;
    color: var(--muted-text);
    margin: 20px 0 8px 0;
    padding-bottom: 6px;
    border-bottom: 1px solid var(--border);
  }
  .toc-category {
    font-size: 13px;
    font-weight: 600;
    color: var(--body-text);
    margin: 14px 0 4px 0;
  }
  .toc ul {
    list-style: none;
    padding: 0;
    margin: 0 0 4px 0;
  }
  .toc li {
    margin: 0;
  }
  .toc a {
    display: block;
    padding: 4px 8px;
    color: var(--muted-text);
    text-decoration: none;
    border-radius: 4px;
    font-size: 13px;
    line-height: 1.35;
  }
  .toc a:hover {
    background: #EEF2F5;
    color: var(--body-text);
  }
  .toc a.active {
    background: #E0E7EB;
    color: var(--body-text);
    font-weight: 500;
  }
  .toc .digest-item a {
    font-style: italic;
  }

  /* -------- Content column -------- */
  .content {
    flex: 1;
    overflow-y: auto;
    padding: 40px 48px 200px 48px;
    background: transparent;
  }
  .content-header {
    max-width: 680px;
    margin: 0 auto 32px auto;
  }
  .content-header h1 {
    font-size: 24px;
    margin: 0 0 4px 0;
  }
  .content-header p {
    font-size: 14px;
    color: var(--muted-text);
    margin: 0;
  }
  .persona-heading {
    max-width: 680px;
    margin: 48px auto 24px auto;
    font-size: 22px;
    font-weight: 700;
    padding-bottom: 12px;
    border-bottom: 2px solid var(--body-text);
  }
  .category-heading {
    max-width: 680px;
    margin: 40px auto 16px auto;
    font-size: 16px;
    font-weight: 600;
    color: var(--muted-text);
    letter-spacing: 0.04em;
    text-transform: uppercase;
  }

  /* -------- Preview block (metadata + email) -------- */
  .preview {
    max-width: 680px;
    margin: 0 auto 56px auto;
    scroll-margin-top: 24px;
  }
  .preview-name {
    font-size: 15px;
    font-weight: 600;
    color: var(--body-text);
    margin: 0 0 12px 0;
  }
  .preview-name .preview-id {
    display: inline-block;
    font-size: 11px;
    font-weight: 700;
    letter-spacing: 0.05em;
    color: var(--muted-text);
    background: var(--meta-bg);
    padding: 2px 6px;
    border-radius: 3px;
    margin-right: 8px;
    vertical-align: middle;
  }

  .metadata {
    background: var(--meta-bg);
    border: 1px solid var(--border);
    border-radius: 6px;
    padding: 12px 16px;
    margin: 0 0 16px 0;
    font-size: 12px;
    line-height: 1.5;
  }
  .metadata-row {
    display: grid;
    grid-template-columns: 110px 1fr;
    gap: 8px;
    padding: 3px 0;
  }
  .metadata-label {
    color: var(--muted-text);
    font-weight: 500;
  }
  .metadata-value {
    color: var(--body-text);
  }
  .tag {
    display: inline-block;
    font-size: 11px;
    font-weight: 600;
    padding: 1px 8px;
    border-radius: 999px;
  }
  .tag.tx { background: var(--tag-tx); color: var(--tag-tx-text); }
  .tag.com { background: var(--tag-com); color: var(--tag-com-text); }
  .tag.sec { background: var(--tag-sec); color: var(--tag-sec-text); }

  /* -------- Email frame (matches the production template) -------- */
  .email {
    max-width: 600px;
    width: 100%;
    margin: 0;
  }
  .email-inner {
    border: 1px solid var(--border);
    border-radius: 8px;
    overflow: hidden;
  }
  .email-header {
    background: var(--header-bg);
    padding: 20px 32px;
  }
  .email-header img {
    height: 32px;
    width: auto;
    display: block;
  }
  .email-body {
    background: var(--card-bg);
    padding: 32px;
  }
  h1.email-heading {
    font-size: 22px;
    line-height: 30px;
    font-weight: 600;
    color: var(--body-text);
    margin: 0 0 16px 0;
  }
  p.email-text {
    font-size: 15px;
    line-height: 24px;
    color: var(--body-text);
    margin: 0 0 16px 0;
  }
  .email-secondary-card {
    background: var(--secondary-card-bg);
    border: 1px solid var(--border);
    border-radius: 6px;
    padding: 16px 20px;
    margin: 8px 0 20px 0;
  }
  .email-name {
    font-size: 16px;
    font-weight: 600;
    color: var(--body-text);
    margin: 0 0 4px 0;
  }
  .email-meta {
    font-size: 13px;
    color: var(--muted-text);
    margin: 0;
  }
  .email-button {
    display: inline-block;
    background: var(--button-bg);
    color: #FFFFFF;
    padding: 12px 24px;
    border-radius: 6px;
    font-size: 15px;
    font-weight: 600;
    text-decoration: none;
    line-height: 20px;
    margin: 8px 0;
  }
  .email-signoff {
    font-size: 15px;
    line-height: 24px;
    color: var(--body-text);
    margin: 16px 0 0 0;
  }

  /* Digest structure */
  .digest-subgroup {
    margin: 0 0 20px 0;
  }
  .digest-subgroup:last-child {
    margin-bottom: 0;
  }
  .digest-subgroup-header {
    padding: 0 0 6px 0;
    border-bottom: 1px solid var(--border);
    margin: 0 0 4px 0;
  }
  .digest-subgroup-title {
    font-size: 16px;
    line-height: 22px;
    font-weight: 600;
    color: var(--body-text);
    margin: 0;
  }
  .digest-subgroup-title a {
    color: var(--body-text);
    text-decoration: none;
  }
  .digest-item {
    padding: 10px 0;
    border-bottom: 1px solid var(--border);
  }
  .digest-item-title {
    font-size: 15px;
    line-height: 22px;
    color: var(--body-text);
    margin: 0 0 2px 0;
  }
  .digest-item-title a {
    color: var(--body-text);
    text-decoration: none;
  }
  .digest-item-meta {
    font-size: 13px;
    line-height: 18px;
    color: var(--muted-text);
    margin: 0;
  }

  .email-footer {
    background: var(--footer-bg);
    padding: 24px 32px;
    border-top: 1px solid var(--border);
  }
  .email-footer p {
    font-size: 13px;
    line-height: 20px;
    color: var(--muted-text);
    margin: 0 0 8px 0;
  }
  .email-footer a {
    color: var(--muted-text);
    text-decoration: underline;
  }
  .email-footer-address {
    font-size: 12px;
    line-height: 18px;
    margin: 16px 0 12px 0 !important;
  }
  .email-footer-legal {
    font-size: 12px;
    line-height: 18px;
    margin: 0 !important;
  }
</style>
</head>

// =============================================================================
// RENDER
// =============================================================================

function escapeHtml(str) {
  return String(str)
    .replace(/&/g, '&amp;')
    .replace(/</g, '&lt;')
    .replace(/>/g, '&gt;')
    .replace(/"/g, '&quot;')
    .replace(/'/g, '&#39;');
}

function tagFor(cls) {
  const label = { tx: 'Transactional', com: 'Commercial', sec: 'Security' }[cls] || cls;
  return `<span class="tag ${cls}">${label}</span>`;
}

function renderMetadata(email) {
  const canSpamText = {
    tx: 'Transactional / relationship (16 CFR 316.3(c))',
    com: 'Commercial (16 CFR 316.3(a))',
    sec: 'Security (transactional, non-optional by policy)',
  }[email.canSpamClass];

  const optOutText = email.optOutable ? 'Yes, via notification preferences' : 'No, sent regardless of preferences';

  return `
    <div class="metadata">
      <div class="metadata-row"><span class="metadata-label">Subject</span><span class="metadata-value">${escapeHtml(email.subject)}</span></div>
      <div class="metadata-row"><span class="metadata-label">Preheader</span><span class="metadata-value">${escapeHtml(email.preheader)}</span></div>
      <div class="metadata-row"><span class="metadata-label">Category</span><span class="metadata-value">${escapeHtml(CATEGORY_LABELS[email.category])}</span></div>
      <div class="metadata-row"><span class="metadata-label">Trigger</span><span class="metadata-value">${escapeHtml(email.trigger)}</span></div>
      ${email.sendTime ? `<div class="metadata-row"><span class="metadata-label">Send time</span><span class="metadata-value">${escapeHtml(email.sendTime)}</span></div>` : ''}
      <div class="metadata-row"><span class="metadata-label">Class</span><span class="metadata-value">${tagFor(email.canSpamClass)} <span style="margin-left:6px;color:var(--muted-text);">${escapeHtml(canSpamText)}</span></span></div>
      <div class="metadata-row"><span class="metadata-label">Opt-out</span><span class="metadata-value">${escapeHtml(optOutText)}</span></div>
      ${email.footNote ? `<div class="metadata-row"><span class="metadata-label">Note</span><span class="metadata-value" style="font-style:italic;">${escapeHtml(email.footNote)}</span></div>` : ''}
    </div>
  `;
}

function renderFooter(email) {
  const isSecurity = email.canSpamClass === 'sec' || !email.optOutable;
  const category = email.category === 'security' ? null : email.category;
  const prefsLine = isSecurity
    ? `<p>This is a ${email.canSpamClass === 'sec' ? 'security' : 'required'} notification and cannot be turned off in your preferences.</p>`
    : `<p><a href="#">Manage ${escapeHtml(CATEGORY_LABELS[email.category])} notification preferences</a></p>`;
  const unsubLine = email.optOutable
    ? ' · <a href="#">Unsubscribe</a>'
    : '';

  return `
    <div class="email-footer">
      ${prefsLine}
      <p>You&rsquo;re receiving this because you have a Krewtree account.</p>
      <p class="email-footer-address">
        Krewtree<br />
        [Street Address Placeholder]<br />
        [City, State ZIP Placeholder]
      </p>
      <p class="email-footer-legal">
        <a href="#">Privacy</a> · <a href="#">Terms</a>${unsubLine}
      </p>
    </div>
  `;
}

function renderTransactionalBody(email) {
  const secondary = email.secondary
    ? `<div class="email-secondary-card">
         <p class="email-name">${escapeHtml(email.secondary.name)}</p>
         <p class="email-meta">${escapeHtml(email.secondary.meta)}</p>
       </div>`
    : '';
  const cta = email.ctaLabel && email.ctaUrl
    ? `<div><a href="${escapeHtml(email.ctaUrl)}" class="email-button">${escapeHtml(email.ctaLabel)}</a></div>`
    : '';
  const signOff = email.signOff
    ? `<p class="email-signoff">${escapeHtml(email.signOff)}</p>`
    : '';

  return `
    <h1 class="email-heading">${escapeHtml(email.heading)}</h1>
    <p class="email-text">${escapeHtml(email.body)}</p>
    ${secondary}
    ${cta}
    ${signOff}
  `;
}

function renderDigestBody(email) {
  const subs = (email.subGroups || []).map((sg) => `
    <div class="digest-subgroup">
      <div class="digest-subgroup-header">
        <p class="digest-subgroup-title"><a href="#">${escapeHtml(sg.title)}</a></p>
      </div>
      ${sg.items.map((item) => `
        <div class="digest-item">
          <p class="digest-item-title"><a href="#">${escapeHtml(item.title)}</a></p>
          ${item.meta ? `<p class="digest-item-meta">${escapeHtml(item.meta)}</p>` : ''}
        </div>
      `).join('')}
    </div>
  `).join('');
  const cta = email.ctaLabel && email.ctaUrl
    ? `<div style="padding-top: 20px;"><a href="${escapeHtml(email.ctaUrl)}" class="email-button">${escapeHtml(email.ctaLabel)}</a></div>`
    : '';

  return `
    <h1 class="email-heading">${escapeHtml(email.heading)}</h1>
    <p class="email-text">${escapeHtml(email.body)}</p>
    ${subs}
    ${cta}
  `;
}

function renderEmail(email) {
  const body = email.type === 'digest' ? renderDigestBody(email) : renderTransactionalBody(email);
  return `
    <section id="${email.id}" class="preview">
      <div class="preview-name"><span class="preview-id">${email.id.toUpperCase()}</span>${escapeHtml(email.name)}</div>
      ${renderMetadata(email)}
      <div class="email">
        <div class="email-inner">
          <div class="email-header">
            <img src="${LOGO_URL}" alt="Krewtree" />
          </div>
          <div class="email-body">${body}</div>
          ${renderFooter(email)}
        </div>
      </div>
    </section>
  `;
}

function renderSection(section, categoryOrder) {
  const sectionEmails = EMAILS.filter((e) => e.section === section);
  const label = section === 'company' ? 'Company' : 'Worker';
  const parts = [`<h2 class="persona-heading" id="${section}">${label} emails</h2>`];

  categoryOrder.forEach((cat) => {
    // For UI-order display, group by settings category; treat 'security' as part of 'account'.
    const catEmails = sectionEmails.filter((e) => e.category === cat || (cat === 'account' && e.category === 'security'));
    if (catEmails.length === 0) return;
    parts.push(`<h3 class="category-heading" id="${section}-${cat}">${CATEGORY_LABELS[cat]}</h3>`);
    catEmails.forEach((e) => parts.push(renderEmail(e)));
  });

  return parts.join('');
}

function renderToc() {
  const parts = [
    '<div class="toc-title">Krewtree emails</div>',
    '<div class="toc-subtitle">42 previews. 24 company, 18 worker.</div>',
  ];

  [
    { section: 'company', label: 'Company', order: CATEGORY_ORDER_COMPANY },
    { section: 'worker', label: 'Worker', order: CATEGORY_ORDER_WORKER },
  ].forEach(({ section, label, order }) => {
    parts.push(`<div class="toc-persona">${label}</div>`);
    const sectionEmails = EMAILS.filter((e) => e.section === section);
    order.forEach((cat) => {
      const catEmails = sectionEmails.filter((e) => e.category === cat || (cat === 'account' && e.category === 'security'));
      if (catEmails.length === 0) return;
      parts.push(`<div class="toc-category">${CATEGORY_LABELS[cat]}</div>`);
      parts.push('<ul>');
      catEmails.forEach((e) => {
        const isDigest = e.type === 'digest';
        parts.push(`<li class="${isDigest ? 'digest-item' : ''}"><a href="#${e.id}">${escapeHtml(e.name)}</a></li>`);
      });
      parts.push('</ul>');
    });
  });

  return parts.join('');
}

function activateTocOnScroll() {
  const links = Array.from(document.querySelectorAll('.toc a'));
  const sections = links.map((a) => document.getElementById(a.getAttribute('href').slice(1))).filter(Boolean);
  const container = document.getElementById('content');

  function update() {
    const scrollTop = container.scrollTop;
    let active = sections[0];
    for (const s of sections) {
      if (s.offsetTop - 60 <= scrollTop) active = s;
    }
    links.forEach((a) => a.classList.toggle('active', a.getAttribute('href') === '#' + active.id));
  }
  container.addEventListener('scroll', update, { passive: true });
  update();
}

// Populate the page
document.getElementById('toc').innerHTML = renderToc();
const contentEl = document.getElementById('content');
contentEl.insertAdjacentHTML('beforeend',
  renderSection('company', CATEGORY_ORDER_COMPANY) +
  renderSection('worker', CATEGORY_ORDER_WORKER)
);
activateTocOnScroll();
</script>
</body>
</html>
